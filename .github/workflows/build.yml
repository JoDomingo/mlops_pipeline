name: Build

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/test_model_monitoring.py -v --cov=src.model_monitoring --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}